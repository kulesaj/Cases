<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>What is your next move? (consider realistically)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--ink:#17252f;--line:#d5dde3;--acc:#0e6b6b;--ok:#1e7a46;--okbg:#e6f4ec;--no:#9a4a12;--nobg:#fcefe3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a21;--ink:#e8eef2;--line:#2b3d49;--acc:#4fc3c3;--ok:#6fd49a;--okbg:#14301f;--no:#f0a66b;--nobg:#33200f}}
:root[data-theme="dark"]{--bg:#101a21;--ink:#e8eef2;--line:#2b3d49;--acc:#4fc3c3;--ok:#6fd49a;--okbg:#14301f;--no:#f0a66b;--nobg:#33200f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px;margin:0}
legend{font:700 20px/1.3 Georgia,"Times New Roman",serif;padding:0 6px}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer}
label.ok{border-color:var(--ok);background:var(--okbg)}
label.no{border-color:var(--no);background:var(--nobg)}
input[type=radio]{margin-top:5px;accent-color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
dialog{border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:16px 44px 16px 18px;max-width:min(420px,90vw);font-size:17px}
dialog.ok{border-color:var(--ok)}dialog.no{border-color:var(--no)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog p{margin:0}dialog p[hidden]{display:none}dialog #msg{font-weight:600;margin-bottom:6px}
.x{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:6px;background:none;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.x:hover{background:var(--line)}
</style></head><body><main>
<fieldset><legend>What is your next move? (consider realistically)</legend>
<label><input type="radio" name="q" value="0"><span>You determine that these findings are to be expected.  You provide reassurance, prescribe antibiotics to treat the UTI, and discharge the patient, as symptoms are most likely related to mild delirium from UTI</span></label>
<label><input type="radio" name="q" value="1"><span>You pursue additional assessment and management</span></label>
</fieldset>
<dialog id="d" aria-describedby="msg2"><button class="x" id="x" aria-label="Close feedback">&times;</button><p id="msg"></p><p id="msg2"></p></dialog>
</main>
<script>
var F=[
  {ok:false,
   h:"This is not the preferred option:",
   t:"The patient returns with urinary tract infection and sepsis two weeks after discharge"},
  {ok:true,
   h:"This is the preferred option:",
   t:"Using the tools recommended in the iCOPE guidelines, you assess cognitive capacity, and you find that cognitive decline is likely.  You assess for associated conditions"}
];
var d=document.getElementById("d"),labels=document.querySelectorAll("label");
document.querySelectorAll("input[name=q]").forEach(function(r){
  r.addEventListener("click",function(){
    var f=F[+r.value];
    labels.forEach(function(l){l.className=""});
    r.parentNode.className=f.ok?"ok":"no";
    document.getElementById("msg").textContent=f.h;document.getElementById("msg").hidden=!f.h;document.getElementById("msg2").textContent=f.t;
    d.className=f.ok?"ok":"no";
    if(!d.open)d.showModal();
  });
});
document.getElementById("x").onclick=function(){d.close()};
d.addEventListener("click",function(e){if(e.target===d)d.close()});
</script></body></html>
